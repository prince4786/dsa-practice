<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="920" viewBox="0 0 1000 920" role="img" aria-labelledby="title desc"><title id="title">Cache full: who leaves?</title><desc id="desc">Same cache A B C, new item D arrives. LRU removes B, LFU C, FIFO A, CLOCK B with the shown flags and hand, random any item.</desc><rect width="1000" height="920" rx="20" fill="#101827"/><g font-family="Arial,sans-serif"><text x="40" y="58" font-size="32" font-weight="bold" fill="#ffffff">Cache full: who leaves?</text><text x="40" y="95" font-size="19" fill="#cbd5e1">Three slots: [ A ] [ B ] [ C ]   +   new item D → one item must leave</text><text x="40" y="125" font-size="16" fill="#94a3b8">Each row applies a different rule to the same cache.</text><rect x="30" y="155" width="940" height="124" rx="12" fill="#1e293b"/><text x="50" y="187" font-size="23" font-weight="bold" fill="#7dd3fc">LRU</text><text x="210" y="187" font-size="20" fill="#ffffff">Remove the least recently used</text><text x="50" y="221" font-size="17" fill="#cbd5e1">Last used: A now · B 10 min ago · C 1 min ago</text><rect x="50" y="235" width="58" height="32" rx="6" fill="#334155"/><text x="79" y="258" text-anchor="middle" font-size="20" fill="#ffffff">A</text><rect x="124" y="235" width="58" height="32" rx="6" fill="#fb7185"/><text x="153" y="258" text-anchor="middle" font-size="20" fill="#ffffff">B</text><rect x="198" y="235" width="58" height="32" rx="6" fill="#334155"/><text x="227" y="258" text-anchor="middle" font-size="20" fill="#ffffff">C</text><text x="300" y="258" font-size="18" fill="#fda4af">Remove B</text><text x="590" y="258" font-size="18" fill="#86efac">Then insert D</text><rect x="30" y="295" width="940" height="124" rx="12" fill="#1e293b"/><text x="50" y="327" font-size="23" font-weight="bold" fill="#7dd3fc">LFU</text><text x="210" y="327" font-size="20" fill="#ffffff">Remove the least often used</text><text x="50" y="361" font-size="17" fill="#cbd5e1">Requests: A 8 times · B 5 times · C 1 time</text><rect x="50" y="375" width="58" height="32" rx="6" fill="#334155"/><text x="79" y="398" text-anchor="middle" font-size="20" fill="#ffffff">A</text><rect x="124" y="375" width="58" height="32" rx="6" fill="#334155"/><text x="153" y="398" text-anchor="middle" font-size="20" fill="#ffffff">B</text><rect x="198" y="375" width="58" height="32" rx="6" fill="#fb7185"/><text x="227" y="398" text-anchor="middle" font-size="20" fill="#ffffff">C</text><text x="300" y="398" font-size="18" fill="#fda4af">Remove C</text><text x="590" y="398" font-size="18" fill="#86efac">Then insert D</text><rect x="30" y="435" width="940" height="124" rx="12" fill="#1e293b"/><text x="50" y="467" font-size="23" font-weight="bold" fill="#7dd3fc">FIFO</text><text x="210" y="467" font-size="20" fill="#ffffff">Remove the first item inserted</text><text x="50" y="501" font-size="17" fill="#cbd5e1">Arrival order: A → B → C. Reading A does not save it.</text><rect x="50" y="515" width="58" height="32" rx="6" fill="#fb7185"/><text x="79" y="538" text-anchor="middle" font-size="20" fill="#ffffff">A</text><rect x="124" y="515" width="58" height="32" rx="6" fill="#334155"/><text x="153" y="538" text-anchor="middle" font-size="20" fill="#ffffff">B</text><rect x="198" y="515" width="58" height="32" rx="6" fill="#334155"/><text x="227" y="538" text-anchor="middle" font-size="20" fill="#ffffff">C</text><text x="300" y="538" font-size="18" fill="#fda4af">Remove A</text><text x="590" y="538" font-size="18" fill="#86efac">Then insert D</text><rect x="30" y="575" width="940" height="124" rx="12" fill="#1e293b"/><text x="50" y="607" font-size="23" font-weight="bold" fill="#7dd3fc">CLOCK</text><text x="210" y="607" font-size="20" fill="#ffffff">Scan; give recently used items a second chance</text><text x="50" y="641" font-size="17" fill="#cbd5e1">Hand starts at A: A=1 → clear &amp; skip; B=0 → remove.</text><rect x="50" y="655" width="58" height="32" rx="6" fill="#334155"/><text x="79" y="678" text-anchor="middle" font-size="20" fill="#ffffff">A</text><rect x="124" y="655" width="58" height="32" rx="6" fill="#fb7185"/><text x="153" y="678" text-anchor="middle" font-size="20" fill="#ffffff">B</text><rect x="198" y="655" width="58" height="32" rx="6" fill="#334155"/><text x="227" y="678" text-anchor="middle" font-size="20" fill="#ffffff">C</text><text x="300" y="678" font-size="18" fill="#fda4af">Remove B</text><text x="590" y="678" font-size="18" fill="#86efac">Then insert D</text><rect x="30" y="715" width="940" height="124" rx="12" fill="#1e293b"/><text x="50" y="747" font-size="23" font-weight="bold" fill="#7dd3fc">Random</text><text x="210" y="747" font-size="20" fill="#ffffff">Choose any item at random</text><text x="50" y="781" font-size="17" fill="#cbd5e1">A, B, or C can leave. No usage history needed.</text><rect x="50" y="795" width="58" height="32" rx="6" fill="#334155"/><text x="79" y="818" text-anchor="middle" font-size="20" fill="#ffffff">A</text><rect x="124" y="795" width="58" height="32" rx="6" fill="#334155"/><text x="153" y="818" text-anchor="middle" font-size="20" fill="#ffffff">B</text><rect x="198" y="795" width="58" height="32" rx="6" fill="#334155"/><text x="227" y="818" text-anchor="middle" font-size="20" fill="#ffffff">C</text><text x="300" y="818" font-size="18" fill="#fda4af">Remove A, B, or C</text><text x="590" y="818" font-size="18" fill="#86efac">Then insert D</text><text x="40" y="890" font-size="17" fill="#cbd5e1">Remember: LRU = when · LFU = how often · FIFO = arrival · CLOCK = second chance</text></g></svg>