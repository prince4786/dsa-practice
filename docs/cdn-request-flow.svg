<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"><rect width="900" height="300" rx="18" fill="#101827"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#ffffff"><text x="450" y="40" font-size="26">A nearby copy saves a long journey</text><rect x="30" y="90" width="180" height="90" rx="12" fill="#334155"/><text x="120" y="125" font-size="22">You</text><text x="120" y="155" font-size="17">request /photo.jpg</text><rect x="310" y="90" width="220" height="90" rx="12" fill="#075985"/><text x="420" y="125" font-size="22">Nearby CDN edge</text><text x="420" y="155" font-size="17">cached copy</text><rect x="670" y="90" width="200" height="90" rx="12" fill="#334155"/><text x="770" y="125" font-size="22">Distant origin</text><text x="770" y="155" font-size="17">original file</text><text x="260" y="125" font-size="25">→</text><text x="260" y="160" font-size="25">←</text><text x="600" y="132" font-size="25">⇄</text><text x="600" y="205" font-size="16" fill="#fda4af">Only if needed</text><text x="450" y="260" font-size="18" fill="#cbd5e1">HIT: reply from edge. MISS: fetch origin, then keep a copy if cacheable.</text></g></svg>